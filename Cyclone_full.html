<!-- FOXIE HACKER BACKGROUND -->
<div id="foxie-hacker-bg"></div>

<style>
  #foxie-hacker-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background:
      radial-gradient(circle at center, rgba(20, 70, 30, 0.18), transparent 55%),
      #010402;
  }

  #foxie-hacker-bg canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Dark cyber grid */
  #foxie-hacker-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(57,255,20,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,20,.035) 1px, transparent 1px);
    background-size: 45px 45px;
    pointer-events: none;
  }

  /* Green glow */
  #foxie-hacker-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%,
        transparent 0%,
        rgba(0,0,0,.15) 45%,
        rgba(0,0,0,.7) 100%);
    pointer-events: none;
  }
</style>

<script>
(function () {

  const container = document.getElementById("foxie-hacker-bg");

  const canvas = document.createElement("canvas");
  container.appendChild(canvas);

  const ctx = canvas.getContext("2d");

  let width;
  let height;
  let columns;
  let drops;

  const fontSize = 16;

  const characters =
    "アイウエオカキクケコサシスセソタチツテト" +
    "0123456789" +
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
    "$#@%&*+=<>/{}[]";

  function resize() {

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    columns = Math.floor(width / fontSize);

    drops = [];

    for (let i = 0; i < columns; i++) {
      drops[i] = Math.random() * -50;
    }
  }

  resize();

  window.addEventListener("resize", resize);

  function draw() {

    /*
      Slight transparent black layer creates
      the classic hacker "trail" effect.
    */
    ctx.fillStyle = "rgba(0, 4, 2, 0.075)";
    ctx.fillRect(0, 0, width, height);

    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {

      const char =
        characters[
          Math.floor(Math.random() * characters.length)
        ];

      const x = i * fontSize;
      const y = drops[i] * fontSize;

      /*
        Bright head
      */
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#39ff14";

      if (Math.random() > 0.96) {
        ctx.fillStyle = "#ffffff";
      } else if (Math.random() > 0.85) {
        ctx.fillStyle = "#9cff8a";
      } else {
        ctx.fillStyle = "#39ff14";
      }

      ctx.fillText(char, x, y);

      ctx.shadowBlur = 0;

      /*
        Random falling speed
      */
      drops[i] += 0.7 + Math.random() * 0.9;

      /*
        Restart some streams
      */
      if (
        y > height &&
        Math.random() > 0.975
      ) {
        drops[i] = Math.random() * -30;
      }
    }

    requestAnimationFrame(draw);
  }

  draw();

})();
</script>
