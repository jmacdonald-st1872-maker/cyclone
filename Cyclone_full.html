<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyclone</title>

  <style>
    :root {
      --accent: #14b8ff;
      --accent-2: #7b61ff;
      --accent-soft: rgba(20, 184, 255, .22);
      --text: #eff8ff;
      --muted: #91a9c7;
      --border: rgba(53, 185, 255, .38);
      --panel: rgba(6, 18, 48, .9);
      --panel-2: rgba(10, 30, 72, .92);
      --page-bg: #020816;
      --board-light: #d7eaf8;
      --board-dark: #3677aa;
      --message-colour: #168ad1;
      --custom-image: none;
      --gradient-1: #020816;
      --gradient-2: #07336d;
      --gradient-3: #160b3d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background: var(--page-bg);
    }

    body {
      overflow-x: hidden;
      background:
        radial-gradient(circle at 13% 10%, rgba(0, 188, 255, .22), transparent 26%),
        radial-gradient(circle at 88% 78%, rgba(116, 70, 255, .2), transparent 33%),
        linear-gradient(135deg, #020816, #071e46 50%, #020816);
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: .55;
      background:
        linear-gradient(rgba(12, 182, 255, .03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(12, 182, 255, .03) 1px, transparent 1px);
      background-size: 34px 34px;
    }

    body.bg-solid {
      background: var(--solid-bg);
    }

    body.bg-gradient {
      background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2), var(--gradient-3));
      background-size: 300% 300%;
      animation: movingGradient 18s ease infinite;
    }

    body.bg-image {
      background:
        linear-gradient(rgba(0, 6, 20, .46), rgba(0, 6, 20, .55)),
        var(--custom-image);
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
    }

    @keyframes movingGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 16px rgba(20, 184, 255, .25);
    }

    input,
    select {
      width: 100%;
      color: var(--text);
      border: 1px solid rgba(54, 183, 255, .35);
      border-radius: 7px;
      outline: none;
      background: rgba(1, 10, 29, .92);
    }

    input:focus,
    select:focus {
      border-color: #8ce7ff;
      box-shadow: 0 0 0 2px rgba(20, 184, 255, .15);
    }

    /* ---------------- Top header ---------------- */

    .topbar {
      height: 58px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      border-bottom: 1px solid rgba(47, 182, 255, .38);
      background:
        radial-gradient(circle at 9% 50%, rgba(0, 170, 255, .26), transparent 22%),
        linear-gradient(90deg, rgba(2, 11, 31, .98), rgba(8, 30, 75, .97), rgba(7, 11, 38, .98));
      box-shadow: 0 4px 20px rgba(0, 92, 180, .18);
    }

    .topbar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      font-weight: 900;
      letter-spacing: 1.8px;
      text-shadow: 0 0 12px rgba(22, 191, 255, .88);
    }

    .topbar-logo-mark {
      font-size: 1.6rem;
      filter: drop-shadow(0 0 8px #14b8ff);
    }

    .topbar-links {
      display: flex;
      align-items: center;
      gap: 18px;
      color: #92b8df;
      font-size: .72rem;
      letter-spacing: .6px;
    }

    .topbar-links span {
      cursor: default;
    }

    .topbar-status {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      color: #a9d6f4;
      font-size: .72rem;
    }

    .status-online {
      color: #47f3aa;
    }

    .status-online::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 5px;
      border-radius: 50%;
      background: #47f3aa;
      box-shadow: 0 0 9px #47f3aa;
    }

    /* ---------------- Icon rail ---------------- */

    .sidebar {
      position: fixed;
      top: 58px;
      bottom: 0;
      left: 0;
      z-index: 70;
      width: 68px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 10px;
      overflow-y: auto;
      border-right: 1px solid rgba(44, 178, 255, .3);
      background: linear-gradient(180deg, rgba(2, 11, 30, .98), rgba(3, 14, 38, .95));
    }

    .sidebar button {
      width: 48px;
      min-height: 46px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #9bbbd9;
      background: transparent;
      font-size: 1.24rem;
    }

    .sidebar button:hover {
      color: #fff;
      border-color: rgba(24, 187, 255, .38);
      background: rgba(20, 184, 255, .11);
    }

    .sidebar button.active {
      color: #fff;
      border-color: rgba(25, 190, 255, .85);
      background: linear-gradient(135deg, rgba(0, 176, 255, .34), rgba(102, 68, 255, .24));
      box-shadow: 0 0 15px rgba(0, 174, 255, .28);
    }

    .sidebar button span {
      display: block;
      margin-top: 2px;
      font-size: .53rem;
      letter-spacing: .2px;
    }

    /* ---------------- Main ---------------- */

    .app-main {
      min-height: 100vh;
      padding: 76px 18px 22px 88px;
    }

    .page {
      display: none;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }

    .page.active {
      display: block;
    }

    .page-head {
      margin-bottom: 14px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 1.4rem;
      text-shadow: 0 0 11px rgba(12, 185, 255, .35);
    }

    .page-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .86rem;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 11px;
      background: linear-gradient(145deg, rgba(7, 24, 57, .93), rgba(3, 12, 32, .94));
      box-shadow: 0 10px 28px rgba(0, 0, 0, .23), inset 0 0 18px rgba(0, 147, 255, .035);
    }

    .card-pad {
      padding: 14px;
    }

    .muted {
      color: var(--muted);
    }

    .btn {
      padding: 8px 11px;
      border: 1px solid rgba(46, 182, 255, .44);
      border-radius: 7px;
      color: #dff4ff;
      background: rgba(7, 31, 73, .96);
    }

    .btn-primary {
      border-color: rgba(112, 219, 255, .75);
      background: linear-gradient(135deg, #0a8edc, #5748e7);
      color: #fff;
    }

    .btn-danger {
      border-color: rgba(255, 98, 116, .56);
      background: rgba(91, 18, 36, .7);
      color: #ffd9df;
    }

    /* ---------------- Chess ---------------- */

    .chess-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 14px;
      align-items: start;
    }

    .chess-main-card {
      min-width: 0;
      padding: 14px;
    }

    .chess-main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .chess-main-header h2 {
      margin: 0;
      font-size: 1.08rem;
    }

    .chess-main-header span {
      color: var(--muted);
      font-size: .76rem;
    }

    .chess-workspace {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(210px, 260px);
      gap: 14px;
      align-items: start;
    }

    .player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      padding: 8px 10px;
      border: 1px solid rgba(37, 173, 255, .32);
      background: rgba(1, 12, 34, .95);
    }

    .player-top {
      border-radius: 8px 8px 0 0;
    }

    .player-bottom {
      border-radius: 0 0 8px 8px;
    }

    .player-name {
      font-weight: 700;
      font-size: .86rem;
    }

    .player-rating {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: .67rem;
    }

    .clock {
      min-width: 60px;
      padding: 4px 7px;
      border: 1px solid rgba(52, 185, 255, .36);
      border-radius: 5px;
      font-family: monospace;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      background: rgba(0, 70, 119, .24);
    }

    #clock-black {
      color: #ff8794;
    }

    #clock-white {
      color: #55f5ac;
    }

    .board-shell {
      width: min(100%, 560px);
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 2px solid rgba(40, 190, 255, .76);
      border-radius: 4px;
      box-shadow: 0 0 24px rgba(0, 169, 255, .3), 0 14px 36px rgba(0, 0, 0, .46);
    }

    #board {
      width: 100%;
      height: 100%;
    }

    .chess-board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
    }

    .chess-square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .chess-square.light {
      background: var(--board-light);
    }

    .chess-square.dark {
      background: var(--board-dark);
    }

    .chess-square.selected {
      box-shadow: inset 0 0 0 4px rgba(255, 241, 63, .75);
    }

    .chess-square.last-move {
      filter: brightness(1.13) saturate(1.16);
    }

    .chess-square.legal::after {
      content: "";
      position: absolute;
      width: 22%;
      height: 22%;
      border-radius: 50%;
      background: rgba(0, 0, 0, .3);
    }

    .chess-square.capture::after {
      content: "";
      position: absolute;
      inset: 10%;
      border: 4px solid rgba(0, 0, 0, .35);
      border-radius: 50%;
    }

      z-index: 2;
      color: white;
      font-family: "Segoe UI Symbol"
